function renderAddTasksList() {
  const keyword = document.getElementById("addTaskSearch").value.toLowerCase();
  const wrap = document.getElementById("addTasksList"); wrap.innerHTML = "";
  const pool = db.events.filter(e => (e.freq === "长期" || e.freq === "常驻") && !e.isArchived && e.name.toLowerCase().includes(keyword));
  if (!pool.length) { wrap.innerHTML = '<div class="meta-small" style="padding:10px;text-align:center">没有可拉取的任务</div>'; return; }
  pool.forEach(ev => {
    const isPulled = db.pulledEvents.includes(ev.id);
    const div = document.createElement("div"); div.className = "item-row";
    div.innerHTML = `
      <input type="checkbox" class="item-checkbox" ${isPulled ? 'checked' : ''}>
      <div class="item-title" style="font-weight:normal"><b>${ev.name}</b><br><span class="meta-small">${ev.cat} | ${ev.est}分钟</span></div>
    `;
    div.querySelector("input").onchange = (e) => {
      if(e.target.checked) { if(!db.pulledEvents.includes(ev.id)) db.pulledEvents.push(ev.id); }
      else db.pulledEvents = db.pulledEvents.filter(id => id !== ev.id);
      saveDB(); renderTodos(); 
    };
    wrap.appendChild(div);
  });
}

function openSingleEventDetail(evId){
  currentSingleEventId = evId;
  document.getElementById("singleEventTitle").innerText = (db.events.find(e => e.id === evId) || { name: "记录" }).name + " 历史";
  document.getElementById("singleEventRange").value = "7"; renderSingleEventDetail(); document.getElementById("singleEventModal").classList.add("show");
}
function renderSingleEventDetail(){
  if(!currentSingleEventId) return;
  let recs = db.records.filter(r => r.eventId === currentSingleEventId).sort((a,b) => new Date(b.start) - new Date(a.start));
  const range = document.getElementById("singleEventRange").value;
  if(range === "day"){
    const td = todayStr(); recs = recs.filter(r => { const st = new Date(r.start); return dateToStr(st) === td; });
  } else if(range !== "all"){ recs = recs.filter(r => new Date(r.start) >= new Date(Date.now() - Number(range)*24*3600*1000)); }

  const totalMin = recs.reduce((s,r) => s + r.durationMs, 0) / 60000;
  const listHtml = recs.map(r => {
      const st = new Date(r.start).toLocaleString(undefined, {month: '2-digit', day: '2-digit', hour: '2-digit', minute:'2-digit'});
      const et = new Date(r.end).toLocaleString(undefined, {month: '2-digit', day: '2-digit', hour: '2-digit', minute:'2-digit'});
      return `<div style="padding:8px;border-bottom:1px solid #eee;font-size:13px">${st} — ${et} (${(r.durationMs/60000).toFixed(0)}分钟)</div>`;
  }).join("");
  
  document.getElementById("singleRecordList").innerHTML = `
    <div style="background:#eef3f2;padding:10px;border-radius:8px;margin-bottom:10px;font-weight:bold;color:#2c7c74;font-size:14px">
      📊 记录 <span style="color:#ef4444">${recs.length}</span> 次，累计 <span style="color:#ef4444">${Math.floor(totalMin/60)}h ${Math.round(totalMin%60)}m</span>
    </div>` + 
    (listHtml || "<div class='meta-small'>无记录</div>");
}
function closeSingleEventModal(){ document.getElementById("singleEventModal").classList.remove("show"); }

  const evId = currentEditEventId;
  closeEditModal();

}

function batchImport(){
  const txt = document.getElementById("batchText").value.trim(), lines = txt.split("\n").filter(x => x.trim() && !x.startsWith("#"));
  let added = 0, updated = 0;
  pushUndo("导入TXT");
  lines.forEach(line => {
    const parts = line.trim().split(/[,，]/).map(p => p.trim()); if(parts.length < 4) return;
    let id, catName, evName, freq, estStr, quadStr = "2";
    if (parts[0].startsWith("ID_") || /^\d{10,}$/.test(parts[0])) [id, catName, evName, freq, estStr, quadStr] = parts;
    else { id = "ID_" + Date.now().toString() + Math.floor(Math.random()*1000); [catName, evName, freq, estStr, quadStr] = parts; }
    if(!catName || !evName) return;
    if(!db.categories.includes(catName)) db.categories.push(catName);
    const lookupId2 = id.startsWith("ID_") ? id.replace("ID_", "") : "ID_" + id;
    const existing = db.events.find(e => e.id === id || e.id === lookupId2);
    let quadVal = 0; if (quadStr && ["1","2","3","4"].includes(quadStr)) quadVal = Number(quadStr);
    if (existing) {
      existing.cat = catName; existing.name = evName; existing.freq = freq; existing.est = Number(estStr)||30; existing.quad = quadVal; updated++;
    } else {
      db.events.push({ id: id, cat: catName, name: evName, freq: freq, est: Number(estStr)||30, quad: quadVal }); added++;
    }
  });
  saveDB(); renderAll(); alert(`新增 ${added} 条，更新 ${updated} 条。`);
}

function exportToTXT() {
  const lines = db.events.map(e => [(e.id.startsWith("ID_") ? e.id : "ID_" + e.id), e.cat, e.name, e.freq, e.est, e.quad].join(","));
  const blob = new Blob(["# [ID,分类,事项名,循环频率,预估分钟,象限]\n" + lines.join("\n")], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "MultiTaskTimeManager_Tasks_" + getFullTimeStr() + ".txt"; a.click(); URL.revokeObjectURL(a.href);
}

function importBackup(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = e => {
    try{
      pushUndo("导入备份"); const data = JSON.parse(e.target.result); db = data;
      db.settings = db.settings || {sleepNeed:7.5, lastActiveDate: '', todoCatFilters: [], quadCollapsed: {1:false,2:false,3:false,4:false,0:false}}; 
      if(!db.settings.todoCatFilters) db.settings.todoCatFilters = [];
      if(!db.settings.quadCollapsed) db.settings.quadCollapsed = {1:false,2:false,3:false,4:false,0:false};
      db.doneEvents = db.doneEvents || {}; db.categories = db.categories || []; db.events = db.events || []; db.records = db.records || []; db.timers = db.timers || {}; 
      db.pausedTimers = db.pausedTimers || []; db.pulledEvents = db.pulledEvents || []; db.selectedCats = db.selectedCats || []; db.collapsedCats = db.collapsedCats || [];
      db.events.forEach(ev => { 
          if(!ev.cat) ev.cat = "未分类"; if(ev.quad === undefined) ev.quad = 2; if(ev.est === undefined) ev.est = 30; 
          if(!ev.freq) ev.freq = ev.repeatPlan || "每日"; if(ev.note === undefined) ev.note = ""; if(ev.dayBoundary === undefined) ev.dayBoundary = "";
          if(ev.isPinned === undefined) ev.isPinned = false;
      });
      db.batchChecked = new Set(Array.isArray(db.batchChecked) ? db.batchChecked : []); 
      saveDB(); 
      document.getElementById("sleepNeed").value = db.settings.sleepNeed;
      renderAll(); alert("备份恢复成功");
    }catch(err){ alert("解析失败：" + err.message); }
  }; r.readAsText(f); input.value = "";
}
